[project]
name = "string-interning-pool-tools"
version = "0.1.2"
description = "Keeps one canonical str object per distinct value so repeated strings share storage."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
